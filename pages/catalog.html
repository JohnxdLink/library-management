<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <link rel="stylesheet" href="../assets/css/pages/catalog.css" />
  </head>
  <body class="h-screen">
    <header class="header__h-10 d-flex flex-column justify-center items-center bg-accent">
      <article class="w-1/2 text-center">
        <div class="d-flex bg-white shadow-md rounded-md">
          <input type="text" placeholder="Search by title, author, or ISBN..." class="input" />
          <button id="homeSearchButton" class="btn-primary btn-search">
            <i class="fa-solid fa-magnifying-glass"></i>
            Search
          </button>
        </div>
      </article>
    </header>

    <main class="px-20 py-5 main-container__h-85">
      <section class="d-flex flex-row gap-2">
        <div class="w-1/5 d-flex flex-column items-start">
          <label class="my-2 label" for="">Categories</label>
          <!-- These are just temporary -->
          <select class="select">
            <option value="">All Categories</option>
            <option value="fiction">Fiction</option>
            <option value="non-fiction">Non-Fiction</option>
            <option value="science">Science</option>
            <option value="mathematics">Mathematics</option>
            <option value="technology">Technology</option>
            <option value="history">History</option>
            <option value="literature">Literature</option>
            <option value="reference">Reference</option>
          </select>
        </div>

        <div class="w-1/5 d-flex flex-column items-start">
          <label class="my-2 label" for="status">Status</label>
          <select id="status" class="select">
            <option value="">All Status</option>
            <option value="available">Available</option>
            <option value="borrowed">Borrowed</option>
            <option value="reserved">Reserved</option>
            <option value="lost">Lost</option>
            <option value="damaged">Damaged</option>
            <option value="maintenance">Under Maintenance</option>
          </select>
        </div>
      </section>

      <section class="mt-5 h-100 d-flex justify-center items-center skeleton">
        <p class="text-primary">Render the list of books here (Coming Soon)</p>
      </section>
    </main>
    <footer class="px-20 footer__h-5 d-flex flex-row items-center justify-end bg-primary">
      <p class="text-white">Pagination features here soon</p>
    </footer>
  </body>
</html>
